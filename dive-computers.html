<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>潜水电脑表大全 - 品牌分类 · 优点 · 重要参数</title>
<style>
:root{
  --bg:#eef4f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
  --accent:#0284c7; --accent-2:#0ea5e9; --deep:#0c4a6e; --teal:#0d9488;
  --line:#e2e8f0; --soft:#f1f5f9; --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px -12px rgba(15,23,42,.15);
  --chip-bg:#ffffff;
}
body.dark{
  --bg:#0b1220; --card:#111c2e; --ink:#e2e8f0; --muted:#94a3b8;
  --line:#24324a; --soft:#0f1a2e; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  --chip-bg:#16223a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}

/* ===== 头部 ===== */
header{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 55%,#0c4a6e 100%);color:#fff;padding:44px 20px 40px;text-align:center;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 20% 110%,rgba(14,165,233,.28),transparent 70%),radial-gradient(500px 200px at 85% 100%,rgba(20,184,166,.18),transparent 70%)}
header h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:2px;position:relative}
header h1 .en{display:block;font-size:clamp(12px,1.6vw,15px);letter-spacing:6px;color:#7dd3fc;font-weight:600;margin-top:6px;text-transform:uppercase}
header p.sub{margin-top:12px;color:#cbd5e1;font-size:14px;position:relative}
.header-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;position:relative}
.header-stats span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);padding:5px 14px;border-radius:999px;font-size:13px}
.header-stats b{color:#7dd3fc;font-weight:700}
.search-wrap{position:relative;max-width:560px;margin:22px auto 0;position:relative}
.search-wrap input{width:100%;padding:13px 46px 13px 18px;border-radius:999px;border:none;outline:none;font-size:15px;background:#fff;color:#0f172a;box-shadow:0 8px 30px -8px rgba(0,0,0,.5)}
.search-wrap .s-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#94a3b8;pointer-events:none}
.search-clear{position:absolute;right:44px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;font-size:15px;cursor:pointer;display:none}
.top-right{position:fixed;top:14px;right:16px;display:flex;gap:8px;z-index:1000}
.top-right button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s}
.top-right button:hover{background:rgba(255,255,255,.26)}
.top-right a.home-btn{background:#fff;color:#0c4a6e;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;transition:background .2s}
.top-right a.home-btn:hover{background:#e0f2fe}
.ver-badge{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#e2e8f0;border-radius:999px;padding:5px 12px;font-size:12px;z-index:5}

/* ===== 品牌导航 ===== */
nav.brand-nav{position:sticky;top:0;z-index:100;background:var(--chip-bg);border-bottom:1px solid var(--line);box-shadow:0 2px 10px -6px rgba(15,23,42,.18);padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.brand-nav::-webkit-scrollbar{display:none}
nav.brand-nav button{flex-shrink:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .18s;white-space:nowrap}
nav.brand-nav button:hover{border-color:var(--accent-2);color:var(--accent)}
nav.brand-nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
nav.brand-nav button .cnt{opacity:.65;font-size:11px;margin-left:3px}

/* ===== 主体 ===== */
main{max-width:1200px;margin:0 auto;padding:26px 20px 140px}
.result-bar{font-size:13px;color:var(--muted);margin-bottom:18px;display:none}
.result-bar b{color:var(--accent)}
.brand-section{margin-bottom:44px}
.brand-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--line);position:relative}
.brand-head::after{content:"";position:absolute;left:0;bottom:-2px;width:88px;height:2px;background:linear-gradient(90deg,var(--accent),var(--teal))}
.brand-flag{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--deep));display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:var(--shadow)}
.brand-info h2{font-size:22px;font-weight:800}
.brand-info h2 .en{color:var(--accent);font-size:15px;font-weight:700;letter-spacing:1px;margin-left:8px}
.brand-info p{margin-top:4px;font-size:13px;color:var(--muted)}
.brand-count{margin-left:auto;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap}

/* ===== 产品卡片 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 14px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(15,23,42,.08),0 16px 36px -14px rgba(15,23,42,.22)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-top .name{font-size:18px;font-weight:800;line-height:1.25}
.card-top .brand{font-size:12px;color:var(--muted);margin-top:3px}
.card-top .price{margin-left:auto;text-align:right;flex-shrink:0}
.card-top .price b{display:block;color:#c2410c;font-size:15px;font-weight:800;white-space:nowrap}
body.dark .card-top .price b{color:#fb923c}
.card-top .price small{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;margin-top:8px;letter-spacing:1px}
.tag.t-entry{background:#16a34a}.tag.t-rec{background:#0284c7}.tag.t-flagship{background:#7c3aed}.tag.t-tech{background:#dc2626}.tag.t-watch{background:#0d9488}.tag.t-hud{background:#db2777}
.pros{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0;flex-grow:1}
.pros .p-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:7px}
.pros ul{list-style:none}
.pros li{font-size:13px;line-height:1.65;padding-left:18px;position:relative;color:var(--ink)}
.pros li::before{content:"✓";position:absolute;left:0;color:#16a34a;font-weight:800}
body.dark .pros li::before{color:#4ade80}
.specs{width:100%;border-collapse:collapse;font-size:12.5px}
.specs td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.specs td:first-child{color:var(--muted);white-space:nowrap;padding-right:12px;width:64px}
.specs tr:last-child td{border-bottom:none}
.specs .v-ai{color:#0d9488;font-weight:600}
.specs .v-no{color:var(--muted)}
.card-foot{margin-top:12px;display:flex;align-items:center;gap:8px}
.cmp-btn{flex:1;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.cmp-btn:hover{background:rgba(2,132,199,.08)}
.cmp-btn.on{background:var(--accent);color:#fff}
.src-note{font-size:11px;color:var(--muted)}

/* ===== 空状态 ===== */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.empty .big{font-size:42px;margin-bottom:10px}

/* ===== 底部对比栏 ===== */
.compare-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px -10px rgba(15,23,42,.4);padding:10px 14px;display:none;align-items:center;gap:10px;z-index:200;max-width:calc(100vw - 28px);flex-wrap:wrap}
.compare-bar.show{display:flex}
.compare-bar .cb-tip{font-size:12px;color:var(--muted)}
.cb-chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cb-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.cb-actions{margin-left:auto;display:flex;gap:8px}
.cb-actions button{border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
.cb-go{background:var(--accent);color:#fff}
.cb-go:disabled{opacity:.4;cursor:not-allowed}
.cb-clear{background:var(--soft);color:var(--muted);border:1px solid var(--line)}

/* ===== 对比弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:1000px;width:100%;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:18px;font-weight:800}
.modal-close{margin-left:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.cmp-table-wrap{overflow-x:auto}
.cmp-table{border-collapse:collapse;font-size:13px;min-width:560px}
.cmp-table th,.cmp-table td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.cmp-table th{background:var(--soft);white-space:nowrap}
.cmp-table td.row-label{background:var(--soft);font-weight:700;color:var(--muted);white-space:nowrap;position:sticky;left:0}
.cmp-table td .m-name{font-weight:800;font-size:14px}
.cmp-table td .m-brand{font-size:11px;color:var(--muted)}
.cmp-table .pros-cell li{list-style:none;font-size:12.5px;line-height:1.6;padding-left:16px;position:relative;margin-bottom:3px}
.cmp-table .pros-cell li::before{content:"✓";position:absolute;left:0;color:#16a34a;font-weight:800}

/* ===== 回到顶部 ===== */
#backTop{position:fixed;right:20px;bottom:84px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 8px 22px -6px rgba(2,132,199,.6);display:none;z-index:150}
#backTop.show{display:block}

footer{text-align:center;padding:26px 20px 40px;color:var(--muted);font-size:12px;line-height:1.9}
footer a{color:var(--accent);text-decoration:none}

@media (max-width:640px){
  .brand-count{display:none}
  .grid{grid-template-columns:1fr}
  .ver-badge{top:10px;left:10px}
}
</style>
</head>

<div class="modal-mask" id="modalMask">

</div>

<button id="backTop" title="回到顶部">↑</button>

<footer>

var TAG_MAP = {
  '入门休闲':'t-entry','休闲进阶':'t-rec','休闲旗舰':'t-flagship',
  '技术潜水':'t-tech','智能腕表':'t-watch','头戴式':'t-hud'
};
var SPEC_ORDER = ['深度等级','屏幕','电池','气体支持','空气整合','潜水模式','连接'];

/* ================= 渲染 ================= */
var state = { search:'', brandKey:'all', compare:[] };
var els = {};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function productById(id){ for(var b of BRANDS) for(var p of b.products) if(p.id===id) return {brand:b, product:p}; return null; }
function brandByKey(k){ for(var b of BRANDS) if(b.key===k) return b; return null; }

function renderNav(){
  var html = '<button data-brand="all" class="active">🏠 全部 <span class="cnt">' + totalModels() + '</span></button>';
  BRANDS.forEach(function(b){
    var n = b.products.length;
    html += '<button data-brand="' + b.key + '">' + b.name + ' <span class="cnt">' + n + '</span></button>';
  });
  els.brandNav.innerHTML = html;
}
function totalModels(){ var n=0; BRANDS.forEach(function(b){ n+=b.products.length; }); return n; }

function matches(p, brand){
  var q = state.search.toLowerCase();
  if(state.brandKey !== 'all' && brand.key !== state.brandKey) return false;
  if(!q) return true;
  var hay = (brand.name + ' ' + p.name + ' ' + p.tag + ' ' + p.price + ' ' + p.pros.join(' '));
  Object.keys(p.specs).forEach(function(k){ hay += ' ' + k + ' ' + p.specs[k]; });
  return hay.toLowerCase().indexOf(q) !== -1;
}

function renderSections(){
  var html = '', count = 0;
  BRANDS.forEach(function(brand){
    var cards = '';
    brand.products.forEach(function(p, i){
      if(!matches(p, brand)) return;
      count++;
      var id = brand.key + '-' + i;
      p.id = id; p.brandName = brand.name;
      cards += cardHtml(brand, p, id);
    });
    if(!cards) return;
    html += '<section class="brand-section" id="sec-' + brand.key + '">'
         +  '<div class="brand-head">'
         +    '<div class="brand-flag">' + brand.flag + '</div>'
         +    '<div class="brand-info"><h2>' + esc(brand.name) + '<span class="en">' + esc(brand.cn) + '</span></h2><p>' + esc(brand.tagline) + '</p></div>'
         +    '<div class="brand-count">' + brand.products.length + ' 款在售</div>'
         +  '</div>'
         +  '<div class="grid">' + cards + '</div>'
         +'</section>';
  });
  els.sections.innerHTML = html;
  els.resultCount.textContent = count;
  els.resultBar.style.display = (state.search || state.brandKey!=='all') ? 'block' : 'none';
  els.emptyBox.style.display = count === 0 ? 'block' : 'none';
}

function cardHtml(brand, p, id){
  var on = state.compare.indexOf(id) !== -1;
  var specs = '';
  SPEC_ORDER.forEach(function(k){
    var v = p.specs[k];
    if(v === undefined) return;
    var cls = (v === '—') ? 'v-no' : (k==='空气整合' && v.charAt(0)==='✔' ? 'v-ai' : '');
    specs += '<tr><td>' + k + '</td><td class="' + cls + '">' + esc(v) + '</td></tr>';
  });
  var pros = '';
  p.pros.forEach(function(t){ pros += '<li>' + esc(t) + '</li>'; });
  return '<div class="card" data-id="' + id + '">'
       + '<div class="card-top"><div><div class="name">' + esc(p.name) + '</div>'
       + '<div class="brand">' + esc(brand.name) + '</div>'
       + '<span class="tag ' + (TAG_MAP[p.tag]||'t-rec') + '">' + p.tag + '</span></div>'
       + '<div class="price"><b>' + esc(p.price) + '</b><small>参考价</small></div></div>'
       + '<div class="pros"><div class="p-title">产 品 优 点</div><ul>' + pros + '</ul></div>'
       + '<table class="specs">' + specs + '</table>'
       + '<div class="card-foot"><button class="cmp-btn' + (on?' on':'') + '" data-id="' + id + '">' + (on?'✓ 已加入对比':'＋ 加入对比') + '</button>'
       + '<span class="src-note">参数仅供参考</span></div>'
       + '</div>';
}

/* ================= 对比 ================= */
function updateCompareBar(){
  var bar = els.compareBar, chips = els.compareChips;
  if(state.compare.length === 0){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  var html = '';
  state.compare.forEach(function(id){
    var r = productById(id); if(!r) return;
    html += '<span class="cb-chip">' + esc(r.product.name) + '<button data-id="' + id + '">✕</button></span>';
  });
  chips.innerHTML = html;
  els.compareGo.disabled = state.compare.length < 2;
}
function toggleCompare(id){
  var idx = state.compare.indexOf(id);
  if(idx !== -1) state.compare.splice(idx,1);
  else{
    if(state.compare.length >= 4){ alert('最多同时对比 4 款'); return; }
    state.compare.push(id);
  }
  renderSections(); updateCompareBar();
}
function openCompare(){
  if(state.compare.length < 2) return;
  var rows = [];
  var labels = ['品牌','定位','参考价'].concat(SPEC_ORDER).concat(['优点']);
  var models = state.compare.map(function(id){ return productById(id); }).filter(Boolean);
  var thead = '<tr><th style="min-width:88px">参数</th>' + models.map(function(m){
    return '<th><div class="m-name">' + esc(m.product.name) + '</div><div class="m-brand">' + esc(m.brand.name) + '</div></th>';
  }).join('') + '</tr>';
  var tbody = '';
  labels.forEach(function(label){
    tbody += '<tr><td class="row-label">' + label + '</td>';
    models.forEach(function(m){
      var v;
      if(label==='品牌') v = m.brand.name;
      else if(label==='定位') v = m.product.tag;
      else if(label==='参考价') v = m.product.price;
      else if(label==='优点'){
        v = '<ul class="pros-cell">' + m.product.pros.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
      } else v = m.product.specs[label] || '—';
      tbody += '<td>' + (label==='优点' ? v : esc(v)) + '</td>';
    });
    tbody += '</tr>';
  });
  els.cmpTableWrap.innerHTML = '<table class="cmp-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
  els.modalMask.classList.add('show');
}

/* ================= 事件 ================= */
function bindEvents(){
  els.searchInput.addEventListener('input', function(){
    state.search = this.value.trim();
    els.searchClear.style.display = state.search ? 'block' : 'none';
    renderSections();
  });
  els.searchClear.addEventListener('click', function(){
    els.searchInput.value = ''; state.search = '';
    els.searchClear.style.display = 'none';
    renderSections(); els.searchInput.focus();
  });
  els.brandNav.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-brand]'); if(!btn) return;
    state.brandKey = btn.getAttribute('data-brand');
    this.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b===btn); });
    renderSections();
    if(state.brandKey !== 'all'){
      var sec = document.getElementById('sec-' + state.brandKey);
      if(sec) sec.scrollIntoView({behavior:'smooth'});
    }
  });
  els.sections.addEventListener('click', function(e){
    var btn = e.target.closest('.cmp-btn'); if(btn) toggleCompare(btn.getAttribute('data-id'));
  });
  els.compareChips.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-id]'); if(btn) toggleCompare(btn.getAttribute('data-id'));
  });
  els.compareGo.addEventListener('click', openCompare);
  els.compareClear.addEventListener('click', function(){ state.compare = []; renderSections(); updateCompareBar(); });
  els.modalClose.addEventListener('click', function(){ els.modalMask.classList.remove('show'); });
  els.modalMask.addEventListener('click', function(e){ if(e.target === els.modalMask) els.modalMask.classList.remove('show'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') els.modalMask.classList.remove('show'); });

  els.themeBtn.addEventListener('click', function(){
    var dark = document.body.classList.toggle('dark');
    try{ localStorage.setItem('dive-table-theme', dark ? 'dark' : 'light'); }catch(err){}
    this.textContent = dark ? '☀️ 浅色' : '🌙 深色';
  });

  var backTop = document.getElementById('backTop');
  window.addEventListener('scroll', function(){
    backTop.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  backTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
}

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded', function(){
  els = {
    brandNav: document.getElementById('brandNav'),
    sections: document.getElementById('sections'),
    resultBar: document.getElementById('resultBar'),
    resultCount: document.getElementById('resultCount'),
    emptyBox: document.getElementById('emptyBox'),
    searchInput: document.getElementById('searchInput'),
    searchClear: document.getElementById('searchClear'),
    compareBar: document.getElementById('compareBar'),
    compareChips: document.getElementById('compareChips'),
    compareGo: document.getElementById('compareGo'),
    compareClear: document.getElementById('compareClear'),
    modalMask: document.getElementById('modalMask'),
    modalClose: document.getElementById('modalClose'),
    cmpTableWrap: document.getElementById('cmpTableWrap'),
    themeBtn: document.getElementById('themeBtn')
  };
  var statsB = document.getElementById('statBrands'), statsM = document.getElementById('statModels');
  if(statsB) statsB.textContent = BRANDS.length;
  if(statsM) statsM.textContent = totalModels();

  try{
    var saved = localStorage.getItem('dive-table-theme');
    if(saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
      document.body.classList.add('dark');
      els.themeBtn.textContent = '☀️ 浅色';
    }
  }catch(err){}

  renderNav();
  renderSections();
  bindEvents();
});
</script>
</body>
</html>
